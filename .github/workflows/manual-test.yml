name: Manual Test Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Populate local Maven repo
        run: ./mvnw -B -V -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 --no-transfer-progress clean install -Dquickly
      - name: Run tests (excluding modules that can't pass in this environment)
        run: ./mvnw -B --no-transfer-progress test -pl '!components/camel-ai/camel-djl,!dsl/camel-jbang/camel-jbang-core,!dsl/camel-jbang/camel-jbang-plugin-kubernetes'
      - name: Archive surefire reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 5
